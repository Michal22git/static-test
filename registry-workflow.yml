name: registry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate registry
        run: node generator/build-registry.mjs --out dist/registry

      - name: Acceptance checks
        run: node test/verify.mjs dist/registry

      - name: Determinism (second run must be byte-identical)
        run: node generator/build-registry.mjs --out dist/registry --check

      - name: Show what was generated
        run: find dist/registry -type f | sort

      - name: Disable Jekyll processing
        run: touch dist/registry/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/registry

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Curl the live registry
        run: |
          BASE="${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"
          BASE="${BASE%/}"
          echo "base: $BASE"
          for P in \
            "/v0.1/servers" \
            "/v0.1/servers/com.example%2Fmcp-ghec/versions/latest" \
            "/v0.1/servers/com.example%2Fmcp-elastic/versions/latest"
          do
            echo "=== GET $P"
            curl -sS -i --path-as-is "$BASE$P" | sed -n '1p;/^[Cc]ontent-[Tt]ype:/p;/^[Ll]ocation:/p;/^[Aa]ccess-[Cc]ontrol/p'
            echo "--- body"
            curl -sS --path-as-is "$BASE$P" | head -c 300; echo; echo
          done
